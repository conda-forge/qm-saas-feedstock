schema_version: 1

context:
  version: "1.2.1"

package:
  name: qm-saas
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/q/qm-saas/qm_saas-${{ version }}.tar.gz
  sha256: 8ba25d8b9e1f584c4a3bff620e583ee34604c7e89f97c92975572f1272762ddc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }},<3.14
    - requests >=2.32.5
    - deprecation >=2.0.0
    - protobuf >=4.25.8
    - h2 >=4.3.0
    - urllib3 >=1.26
    - h11 >=0.16.0

tests:
  - python:
      imports:
        - qm_saas
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: QM Simulator as a Service is a client library to launch simulator instances for QUA programs.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://pypi.org/project/qm-saas/

extra:
  recipe-maintainers:
    - noya-gol
